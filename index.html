const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=(y,m)=>{const yy=y+Math.floor(m/12);const mm=((m%12)+12)%12;return{y:yy,m:mm};};
const mkey=(y,m)=>y*12+m;
const mlbl=(y,m)=>`${MESES[m]}/${String(y).slice(2)}`;
const sugg=txt=>{const t=(txt||'').toLowerCase();for(const[p,c]of DEPARA)if(t.includes(p))return c;return'Outros';};

function fatInicio(data,cartao,forma){
  if(!data)return norm(new Date().getFullYear(),new Date().getMonth()+1);
  const d=new Date(data+'T00:00:00');const day=d.getDate(),m=d.getMonth(),y=d.getFullYear();
  let dm;
  if(forma!=='Cartão')dm=m;
  else{const info=CART_INFO[cartao];const fecha=info?info.fecha:20;
    dm=cartao==='Nubank'?(day<=14?m:m+1):(day<=fecha?m+1:m+2);}
  return norm(y,dm);
}

function calcParcelas(lanc){
  const out=[];
  for(const l of lanc){
    if(l.tipo==='Investimento'||l.tipo==='Entrada')continue;
    const np=l.recorrente?12:(l.avista?1:Math.max(1,parseInt(l.parcelas)||1));
    const vp=(parseFloat(l.valor)||0)/(l.avista?1:Math.max(1,parseInt(l.parcelas)||1));
    const f0=fatInicio(l.data,l.cartao||'',l.forma);
    for(let i=0;i<np;i++){
      const{y,m}=norm(f0.y,f0.m+i);
      out.push({y,m,key:mkey(y,m),cartao:l.forma==='Cartão'?l.cartao:l.forma,
        tipo:l.tipo,categoria:l.categoria,valor:vp,item:l.item,forma:l.forma,lancId:l.id});
    }
  }
  return out;
}

// ── Supabase ops ──────────────────────────────────────────────────────────────
async function sbDo(op,msg){
  try{const{error}=await op();if(error){alert((msg||'Erro')+': '+error.message);return false;}return true;}
  catch(e){alert('Erro: '+e.message);return false;}
}

async function sbInit(){
  S.loading=true;render();
  try{
    const[{data:ls},{data:ps},{data:cs},{data:ms}]=await Promise.all([
      SB.from('lancamentos').select('*').order('created_at',{ascending:false}),
      SB.from('patrimonio').select('*'),
      SB.from('contas').select('*').order('created_at',{ascending:true}),
      SB.from('movimentacoes').select('*').order('data',{ascending:false}),
    ]);
    S.lanc=ls||[];S.patr=ps||[];S.contas=cs||[];S.mov=ms||[];
    // inserir lançamentos históricos se não existirem
    const ids=new Set(S.lanc.map(x=>x.id));
    const novos=LANC_HIST.filter(x=>!ids.has(x.id));
    if(novos.length){
      await SB.from('lancamentos').insert(novos);
      S.lanc=[...S.lanc,...novos];
    }
    const cc=localStorage.getItem('fin_cfg');if(cc)S.cfg={...DEF_CFG,...JSON.parse(cc)};
    getOrc();
  }catch(e){console.error(e);flash('⚠ Erro: '+e.message);}
  S.loading=false;render();
}

async function doAddLanc(l){
  if(!await sbDo(()=>SB.from('lancamentos').insert([l]),'Erro ao salvar'))return false;
  S.lanc=[l,...S.lanc];return true;
}
async function updLanc(l){
  if(!await sbDo(()=>SB.from('lancamentos').update(l).eq('id',l.id),'Erro'))return;
  S.lanc=S.lanc.map(x=>x.id===l.id?l:x);S.tab='painel';S.editL=null;flash('Atualizado! ✓');render();
}
async function delLanc(id){
  await SB.from('lancamentos').delete().eq('id',id);
  S.lanc=S.lanc.filter(x=>x.id!==id);render();

async function updConta(c){

async function addMovComSaldo(mv){
  if(!await sbDo(()=>SB.from('movimentacoes').insert([mv]),'Erro movimentação'))return;
  S.mov=[mv,...S.mov];
  const conta=S.contas.find(c=>c.id===mv.conta_id);
  if(conta){
    const campo=mv.tipo_conta==='Fazenda'?'saldo_fazenda':'saldo_pessoal';
    const delta=mv.natureza==='Entrada'?(+mv.valor):-(+mv.valor);
    await updConta({...conta,[campo]:(+(conta[campo]||0))+(+delta)});
  } else {render();}
}

async function confirmarDebito(contaId,tipoConta){
  const l=S.pendingLanc;if(!l)return;
  document.getElementById('modal-root').innerHTML='';
  const ok=await doAddLanc(l);
  if(!ok)return;
  // registrar movimentação automática
  const mv={id:uid(),conta_id:contaId,descricao:l.item,categoria:l.categoria,
    natureza:'Saída',tipo_conta:tipoConta,valor:l.valor,data:l.data,
    destino:l.local||l.cartao||'',created_at:new Date().toISOString()};
  await addMovComSaldo(mv);
  S.pendingLanc=null;S.tab='painel';S.editL=null;flash('Salvo e conta debitada! ✓');render();
}

function cancelDebito(){
  const l=S.pendingLanc;if(!l)return;
  document.getElementById('modal-root').innerHTML='';
  doAddLanc(l).then(ok=>{if(ok){S.pendingLanc=null;S.tab='painel';S.editL=null;flash('Salvo! ✓');render();}});
}

async function salvarLanc(){
  ensureL();const f=S.editL;
  ['item','local','valor','data','descricao'].forEach(k=>{const el=document.getElementById('f-'+k);if(el)f[k]=el.value;});
  if(!f.item){alert('Preencha a descrição.');return;}
  if(!f.valor||+f.valor===0){alert('Preencha o valor.');return;}
  const l={...f,valor:f.valor.toString()};
  const isEdit=l.id&&S.lanc.find(x=>x.id===l.id);
  if(isEdit){await updLanc(l);return;}
  // novo lançamento — checar se deve debitar conta
  const deveDebitar=['Pix','Boleto','Débito','Transferência'].includes(l.forma)&&(l.tipo==='Pessoal'||l.tipo==='Fazenda');
  const novol={...l,id:uid()};
  if(deveDebitar&&S.contas.length>0){showDebitoModal(novol);}
  else{const ok=await doAddLanc(novol);if(ok){S.tab='painel';S.editL=null;flash('Salvo! ✓');render();}}
}

// ── Cálculos de série ─────────────────────────────────────────────────────────
function calcSerie(parcelas,meses){
  let res=S.cfg.reservaInicial;const mp={};
  for(const mo of meses){
    const ps=parcelas.filter(p=>p.key===mo.key);
    const despesas=ps.filter(p=>p.tipo==='Pessoal').reduce((a,p)=>a+p.valor,0);
    const aportes=S.lanc.filter(l=>l.tipo==='Investimento').filter(l=>{
      const f=fatInicio(l.data,'','Pix');return mkey(f.y,f.m)===mo.key;
    }).reduce((a,l)=>a+(+l.valor||0),0);
    const entradas=S.lanc.filter(l=>l.tipo==='Entrada').filter(l=>{
      const f=fatInicio(l.data,'','Pix');return mkey(f.y,f.m)===mo.key;
    }).reduce((a,l)=>a+(+l.valor||0),0);
    const saidaTotal=despesas+aportes;
    const folgaReal=entradas-saidaTotal;
    const folgaProj=(entradas+S.cfg.salarioEsperado)-saidaTotal;
    res+=folgaReal;
    mp[mo.key]={despesas,aportes,entradas,saidaTotal,folgaReal,folgaProj,reserva:res};
  }
  return mp;
}

// ── Alertas ───────────────────────────────────────────────────────────────────
function calcAlertas(parcelas){
  const alertas=[];const hoje=new Date();const dias=S.cfg.diasAlertaFatura||3;
  const orc=getOrc();
  for(const[cart,info]of Object.entries(CART_INFO)){
    let v=new Date(hoje.getFullYear(),hoje.getMonth(),info.vence);
    if(v<=hoje)v=new Date(hoje.getFullYear(),hoje.getMonth()+1,info.vence);
    const diff=Math.ceil((v-hoje)/(864e5));
    if(diff<=dias&&diff>=0){
      const mk=mkey(v.getFullYear(),v.getMonth());
      const tot=parcelas.filter(p=>p.key===mk&&p.cartao===cart).reduce((a,p)=>a+p.valor,0);
      if(tot>0)alertas.push({tipo:diff<=1?'danger':'warn',msg:`💳 Fatura ${cart} vence em ${diff===0?'hoje':`${diff}d`} — ${brl(tot)}`});
    }
  }
  const mesKey=mkey(hoje.getFullYear(),hoje.getMonth());
  const catAgg={};
  parcelas.filter(p=>p.key===mesKey&&p.tipo==='Pessoal').forEach(p=>{catAgg[p.categoria]=(catAgg[p.categoria]||0)+p.valor;});
  for(const{cat,valor:teto}of orc.variavel){
    if(!teto)continue;const real=catAgg[cat]||0;
    if(real>teto)alertas.push({tipo:'danger',msg:`📊 ${cat}: ${brl(real)} — estourou ${brl(teto)}`});
    else if(real>teto*.8)alertas.push({tipo:'warn',msg:`📊 ${cat}: ${brl(real)} de ${brl(teto)} (${Math.round(real/teto*100)}%)`});
  }
  for(const c of S.contas){
    if((+c.alerta_minimo||0)>0&&(+c.saldo_pessoal||0)<(+c.alerta_minimo||0))
      alertas.push({tipo:'danger',msg:`🏦 ${c.nome} pessoal: saldo baixo (${brl(+c.saldo_pessoal||0)})`});
  }
  return alertas;
}

    <div><label class="lbl">Saldo fazenda (R$)</label><input type="number" inputmode="decimal" class="inp" id="ec-f" value="${+c.saldo_fazenda||0}"></div>
    <div><label class="lbl">Alerta mínimo pessoal (R$)</label><input type="number" inputmode="decimal" class="inp" id="ec-min" value="${+c.alerta_minimo||0}" placeholder="0 = sem alerta"></div>
    <button onclick="salvarEditConta('${c.id}')" style="padding:13px;border-radius:12px;background:#1f5138;color:white;border:none;font-weight:700;font-size:15px;cursor:pointer;width:100%">Salvar</button>
  </div>`;}
  const addMovHtml=S.showAddMov?`<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px;border-color:#1f5138">
    <div style="font-weight:700;color:#1f5138;font-size:13px">Nova movimentação — ${S.contas.find(c=>c.id===S.showAddMov)?.nome||''}</div>

    <div><label class="lbl">Descrição</label><input class="inp" id="mv-desc" placeholder="ex.: Salário, Fatura BB…"></div>
    <div><label class="lbl">Categoria</label><select class="sel" id="mv-cat">${[...CATS_DESP,...CATS_ENT].filter((v,i,a)=>a.indexOf(v)===i).map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div><label class="lbl">Natureza</label><div style="display:flex;gap:8px">
      <button class="btn act-vd" id="mv-ent" onclick="document.getElementById('mv-ent').className='btn act-vd';document.getElementById('mv-sai').className='btn'">↑ Entrada</button>
      <button class="btn" id="mv-sai" onclick="document.getElementById('mv-sai').className='btn act-vm';document.getElementById('mv-ent').className='btn'">↓ Saída</button>
    </div></div>
    <div><label class="lbl">Pessoal ou Fazenda</label><div style="display:flex;gap:8px">
      <button class="btn act" id="mv-pes" onclick="document.getElementById('mv-pes').className='btn act';document.getElementById('mv-faz').className='btn'">Pessoal</button>
      <button class="btn" id="mv-faz" onclick="document.getElementById('mv-faz').className='btn act-am';document.getElementById('mv-pes').className='btn'">Fazenda</button>
    </div></div>
    <div><label class="lbl">Valor (R$)</label><input type="number" inputmode="decimal" class="inp" id="mv-val" placeholder="0,00"></div>
    <div><label class="lbl">Destino / Origem</label><input class="inp" id="mv-dest" placeholder="ex.: Lucas, Supermercado…"></div>
    <div style="display:flex;gap:8px">

      <button onclick="S.showAddMov=null;render()" style="padding:11px 16px;border-radius:10px;background:#f3f4f6;color:#6b7280;border:none;font-weight:700;cursor:pointer">Cancelar</button>
    </div>
  </div>`:'';
  const cards=S.contas.map(c=>{
    const sp=+c.saldo_pessoal||0,sf=+c.saldo_fazenda||0;
    const movs=S.mov.filter(m=>m.conta_id===c.id);
    const isOpen=S.selConta===c.id;
    const movRows=movs.slice(0,8).map(m=>`<div style="padding:9px 14px;border-bottom:1px solid #f9fafb;display:flex;justify-content:space-between;align-items:center"><div style="min-width:0;flex:1"><div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.descricao||m.categoria)}</div><div style="font-size:10px;color:#9ca3af">${m.data} · ${m.categoria} · ${m.tipo_conta}${m.destino?' · '+esc(m.destino):''}</div></div><span class="mon" style="font-size:13px;font-weight:700;padding-left:8px;flex-shrink:0;color:${m.natureza==='Entrada'?'#16a34a':'#b23a48'}">${m.natureza==='Entrada'?'+':'-'}${brl(+m.valor||0)}</span></div>`).join('');
    return`<div class="card"><div style="padding:14px;cursor:pointer" onclick="S.selConta=S.selConta==='${c.id}'?null:'${c.id}';render()"><div class="row"><div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:10px;background:${CCOR[c.nome]||'#888'};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:white">${c.nome[0]}</div><div><div style="font-weight:700;font-size:15px">${c.nome}</div><div style="font-size:11px;color:#9ca3af">P: ${brl(sp)} · F: ${brl(sf)}</div></div></div><div style="text-align:right"><div class="mon" style="font-weight:800;font-size:16px">${brl(sp+sf)}</div><div style="font-size:10px;color:#9ca3af;margin-top:2px">${isOpen?'▲':'▼'}</div></div></div></div>
      ${isOpen?`<div style="border-top:1px solid #f0f0f0"><div style="padding:10px 14px;display:flex;gap:8px;border-bottom:1px solid #f0f0f0"><button onclick="S.showAddMov='${c.id}';render()" style="flex:1;padding:9px;border-radius:10px;background:#1f5138;color:white;border:none;font-weight:700;font-size:13px;cursor:pointer">+ Movimentação</button><button onclick="S.editC=S.contas.find(x=>x.id==='${c.id}');S.showAddMov=null;render()" style="padding:9px 14px;border-radius:10px;background:#f3f4f6;color:#6b7280;border:none;font-weight:700;font-size:13px;cursor:pointer">✏️ Saldo</button></div>${movRows||'<div style="padding:14px;text-align:center;color:#9ca3af;font-size:13px">Nenhuma movimentação</div>'}${movs.length>8?`<div style="padding:8px;text-align:center;font-size:12px;color:#9ca3af">${movs.length-8} mais…</div>`:''}</div>`:''}
    </div>`;
  }).join('');
  const addContaHtml=S.showAddConta?`<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px"><div style="font-weight:700;color:#1f5138;font-size:13px">Nova conta</div><div><label class="lbl">Banco</label><select class="sel" id="nc-nome">${CONTAS_BANCO.map(b=>`<option>${b}</option>`).join('')}</select></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label class="lbl">Saldo pessoal</label><input type="number" inputmode="decimal" class="inp" id="nc-p" placeholder="0,00"></div><div><label class="lbl">Saldo fazenda</label><input type="number" inputmode="decimal" class="inp" id="nc-f" placeholder="0,00"></div></div><div><label class="lbl">Alerta mínimo pessoal</label><input type="number" inputmode="decimal" class="inp" id="nc-min" placeholder="0 = sem alerta"></div><div style="display:flex;gap:8px"><button onclick="salvarNovaConta()" style="flex:1;padding:11px;border-radius:10px;background:#1f5138;color:white;border:none;font-weight:700;cursor:pointer">Criar</button><button onclick="S.showAddConta=false;render()" style="padding:11px 16px;border-radius:10px;background:#f3f4f6;color:#6b7280;border:none;font-weight:700;cursor:pointer">Cancelar</button></div></div>`:`<button onclick="S.showAddConta=true;S.showAddMov=null;render()" style="padding:12px;border-radius:12px;background:white;border:2px dashed #d1d5db;color:#6b7280;font-weight:700;font-size:14px;cursor:pointer;width:100%">+ Adicionar conta</button>`;
  return`
    <div class="hero" style="background:#1a3a6b"><div class="row"><div><div style="font-size:9px;text-transform:uppercase;opacity:.7;font-weight:700">Saldo pessoal total</div><div class="mon" style="font-size:24px;font-weight:800;margin-top:3px">${brl(totP)}</div></div><div style="text-align:right"><div style="font-size:9px;text-transform:uppercase;opacity:.7;font-weight:700">Fazenda</div><div class="mon" style="font-size:18px;font-weight:700;margin-top:3px;color:#86efac">${brl(totF)}</div></div></div></div>
    <div style="font-size:11px;color:#9ca3af;font-style:italic">Compras à vista/Pix/Boleto debitam automaticamente a conta ao lançar.</div>
    ${cards}${addMovHtml}${addContaHtml}
    <div style="height:8px"></div>`;
}

// ── Investimentos + Patrimônio (unificado) ────────────────────────────────────
function rInvestimentos(parcelas){
  const hoje=new Date();
  const totAtual=S.patr.reduce((a,p)=>a+(+p.valor_atual||0),0);
  const totInvest=S.patr.reduce((a,p)=>a+(+p.valor_investido||0),0);
  const rent=totAtual-totInvest;
  // aportes lançados
  const aportes=S.lanc.filter(l=>l.tipo==='Investimento').sort((a,b)=>b.data.localeCompare(a.data));
  const totalAportes=aportes.reduce((a,l)=>a+(+l.valor||0),0);
  // agrupar patrimônio por categoria
  const bycat={};S.patr.forEach(p=>{bycat[p.categoria]=bycat[p.categoria]||[];bycat[p.categoria].push(p);});

  if(S.editInv){const p=S.editInv;return`<div style="display:flex;flex-direction:column;gap:12px">
    <div class="row"><span style="font-weight:700;color:#2c6fad">Atualizar ativo</span><button onclick="S.editInv=null;render()" style="font-size:12px;color:#9ca3af;background:none;border:none;cursor:pointer;text-decoration:underline">cancelar</button></div>
    <div><label class="lbl">Nome</label><input class="inp" id="ei-nome" value="${esc(p.nome||'')}"></div>
    <div><label class="lbl">Valor investido (R$)</label><input type="number" inputmode="decimal" class="inp" id="ei-inv" value="${p.valor_investido||0}"></div>
    <div><label class="lbl">Valor atual (R$)</label><input type="number" inputmode="decimal" class="inp" id="ei-at" value="${p.valor_atual||0}"></div>
    <div><label class="lbl">Aporte mensal (R$)</label><input type="number" inputmode="decimal" class="inp" id="ei-ap" value="${p.aporte_mensal||0}"></div>
    <button onclick="salvarEditInv('${p.id}')" style="padding:13px;border-radius:12px;background:#2c6fad;color:white;border:none;font-weight:700;font-size:15px;cursor:pointer;width:100%">Salvar</button>
  </div>`;}

  const toggle=`<div style="display:flex;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;background:white">
    <button onclick="S.invView='aportes';render()" style="flex:1;padding:10px;border:none;font-weight:700;font-size:13px;cursor:pointer;background:${S.invView==='aportes'?'#2c6fad':'white'};color:${S.invView==='aportes'?'white':'#6b7280'}">📊 Aportes</button>
    <button onclick="S.invView='patrimonio';render()" style="flex:1;padding:10px;border:none;font-weight:700;font-size:13px;cursor:pointer;background:${S.invView==='patrimonio'?'#2c6fad':'white'};color:${S.invView==='patrimonio'?'white':'#6b7280'}">🏦 Patrimônio</button>
  </div>`;

  function viewAportes(){
    const catAgg={};aportes.forEach(l=>{catAgg[l.categoria]=(catAgg[l.categoria]||0)+(+l.valor||0);});
    const catRows=Object.entries(catAgg).sort((a,b)=>b[1]-a[1]).map(([cat,val])=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span style="font-size:13px;color:#374151">${cat}</span><span class="mon" style="font-weight:700;font-size:13px">${brl(val)}</span></div>`).join('');
    const aportesRows=aportes.slice(0,10).map(l=>`<div class="card" style="padding:11px 14px;display:flex;align-items:center;justify-content:space-between"><div style="min-width:0;flex:1"><div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.item)}</div><div style="font-size:10px;color:#9ca3af">${l.data} · ${l.categoria}${l.recorrente?' · ↻ recorrente':''}</div></div><span class="mon" style="font-size:13px;font-weight:700;color:#2c6fad;padding-left:8px;flex-shrink:0">${brl(+l.valor||0)}</span></div>`).join('');
    return`
      <div class="card" style="padding:14px">
        <div style="font-size:10px;text-transform:uppercase;color:#6b7280;font-weight:700;margin-bottom:8px">Por categoria</div>
        ${catRows||'<div style="color:#9ca3af;font-size:13px">Nenhum aporte lançado ainda.</div>'}
      </div>
      <div class="lbl">Histórico de aportes</div>
      <div style="display:flex;flex-direction:column;gap:5px">${aportesRows||'<div style="text-align:center;padding:24px;color:#9ca3af;font-size:13px">Nenhum aporte lançado.<br>Use tipo <b>Investimento</b> ao lançar.</div>'}</div>`;
  }

  function viewPatrimonio(){
    const cats=Object.entries(bycat).map(([cat,items])=>{
      const totCat=items.reduce((a,x)=>a+(+x.valor_atual||0),0);
      const rows=items.map(p=>{const r=(+p.valor_atual||0)-(+p.valor_investido||0);
        return`<div style="padding:10px 14px;border-bottom:1px solid #f9fafb;display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1"><div style="font-size:13px;font-weight:600">${esc(p.nome)}</div><div style="font-size:10px;color:#9ca3af;margin-top:2px">Invest. ${brl(p.valor_investido)}${p.aporte_mensal>0?` · Aporte ${brl(p.aporte_mensal)}/mês (dia ${p.dia_aporte})`:''}</div><div style="font-size:11px;font-weight:600;margin-top:2px;color:${r>=0?'#16a34a':'#b23a48'}">${r>=0?'+':''}${brl(r)} (${pct(p.valor_atual,p.valor_investido)})</div></div><div style="text-align:right;padding-left:8px"><div class="mon" style="font-weight:800;font-size:14px">${brl(p.valor_atual)}</div><button onclick="S.editInv=S.patr.find(x=>x.id==='${p.id}');render()" style="font-size:11px;color:#2c6fad;background:none;border:none;cursor:pointer;text-decoration:underline;margin-top:3px">atualizar</button></div></div>`;
      }).join('');
      return`<div class="card"><div style="padding:10px 14px;background:#f9fafb;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between"><span style="font-weight:700;font-size:12px">${cat}</span><span class="mon" style="font-weight:800;font-size:12px">${brl(totCat)}</span></div>${rows}</div>`;
    }).join('');
    const addForm=S.showAddInv?`<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px"><div style="font-weight:700;color:#2c6fad;font-size:13px">Novo ativo</div><div><label class="lbl">Nome</label><input class="inp" id="ni-nome" placeholder="ex.: Tesouro Selic 2031"></div><div><label class="lbl">Categoria</label><select class="sel" id="ni-cat">${CAT_INV.map(c=>`<option>${c}</option>`).join('')}</select></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label class="lbl">Valor investido</label><input type="number" inputmode="decimal" class="inp" id="ni-inv" placeholder="0,00"></div><div><label class="lbl">Valor atual</label><input type="number" inputmode="decimal" class="inp" id="ni-at" placeholder="0,00"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label class="lbl">Aporte/mês</label><input type="number" inputmode="decimal" class="inp" id="ni-ap" placeholder="0"></div><div><label class="lbl">Dia aporte</label><input type="number" inputmode="numeric" class="inp" id="ni-dia" placeholder="10"></div></div><div style="display:flex;gap:8px"><button onclick="salvarNovoInv()" style="flex:1;padding:11px;border-radius:10px;background:#2c6fad;color:white;border:none;font-weight:700;cursor:pointer">Salvar</button><button onclick="S.showAddInv=false;render()" style="padding:11px 16px;border-radius:10px;background:#f3f4f6;color:#6b7280;border:none;font-weight:700;cursor:pointer">Cancelar</button></div></div>`:`<button onclick="S.showAddInv=true;render()" style="padding:12px;border-radius:12px;background:white;border:2px dashed #d1d5db;color:#6b7280;font-weight:700;font-size:14px;cursor:pointer;width:100%">+ Novo ativo</button>`;
    return`${cats}${addForm}`;
  }

  return`
    <div class="hero" style="background:#2c6fad">
      <div class="row">
        <div><div style="font-size:9px;text-transform:uppercase;opacity:.7;font-weight:700">Patrimônio atual</div><div class="mon" style="font-size:24px;font-weight:800;margin-top:3px">${brl(totAtual)}</div><div style="font-size:11px;opacity:.8;margin-top:4px">Invest. ${brl(totInvest)} · <span style="color:#86efac">+${brl(rent)}</span></div></div>
        <div style="text-align:right"><div style="font-size:9px;text-transform:uppercase;opacity:.7;font-weight:700">Total aportado</div><div class="mon" style="font-size:18px;font-weight:700;margin-top:3px;color:#bfdbfe">${brl(totalAportes)}</div></div>
      </div>
    </div>
    ${toggle}
    ${S.invView==='aportes'?viewAportes():viewPatrimonio()}
    <div style="height:8px"></div>`;
}

// ── Orçamento ─────────────────────────────────────────────────────────────────
function rOrcamento(parcelas){
  const orc=getOrc();
  const hoje=new Date();const mesKey=mkey(hoje.getFullYear(),hoje.getMonth());
  const catAgg={};parcelas.filter(p=>p.key===mesKey&&p.tipo==='Pessoal').forEach(p=>{catAgg[p.categoria]=(catAgg[p.categoria]||0)+p.valor;});
  const totFix=orc.fixo.reduce((a,x)=>a+x.valor,0);
  const totVar=orc.variavel.reduce((a,x)=>a+x.valor,0);
  const orcRow=(item,tipo)=>{
    const real=catAgg[item.cat]||0;const teto=item.valor;
    const pct=teto?Math.min(100,real/teto*100):0;
    const cor=pct>100?'#b23a48':pct>80?'#f59e0b':'#1f5138';
    return`<div style="padding:10px 14px;border-bottom:1px solid #f9fafb">
      <div class="row">
        <span style="font-size:13px">${esc(item.cat)}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="mon" style="font-size:12px;color:${real>0?cor:'#9ca3af'}">${real>0?brl(real):'—'}</span>
          <span style="font-size:11px;color:#9ca3af">/ ${brl(teto)}</span>
          <button onclick="S.orcEdit={cat:'${esc(item.cat)}',valor:${item.valor},tipo:'${tipo}'};render()" style="background:none;border:none;cursor:pointer;font-size:13px;color:#9ca3af;padding:2px">✏️</button>
        </div>
      </div>
      ${teto&&real>0?`<div class="bar-bg" style="margin-top:4px"><div class="bar-fill" style="width:${pct.toFixed(1)}%;background:${cor}"></div></div>`:''}
    </div>`;
  };
  const editForm=S.orcEdit?`<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px;border-color:#1f5138">
    <div class="row"><span style="font-weight:700;color:#1f5138">Editar: ${esc(S.orcEdit.cat)}</span><button onclick="S.orcEdit=null;render()" style="font-size:12px;color:#9ca3af;background:none;border:none;cursor:pointer;text-decoration:underline">cancelar</button></div>
    <div><label class="lbl">Novo teto mensal (R$)</label><input type="number" inputmode="decimal" class="inp" id="oe-val" value="${S.orcEdit.valor}" placeholder="0,00"></div>
    <button onclick="salvarOrcEdit()" style="padding:11px;border-radius:10px;background:#1f5138;color:white;border:none;font-weight:700;cursor:pointer;width:100%">Salvar teto</button>
  </div>`:'';
  const addForm=S.showAddOrc?`<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px"><div style="font-weight:700;color:#1f5138;font-size:13px">Nova categoria</div><div><label class="lbl">Nome</label><input class="inp" id="ao-cat" placeholder="ex.: Pets, Cursos online…"></div><div><label class="lbl">Teto mensal (R$)</label><input type="number" inputmode="decimal" class="inp" id="ao-val" placeholder="0,00"></div><div><label class="lbl">Tipo</label><div style="display:flex;gap:8px"><button class="btn" id="ao-fix" onclick="document.getElementById('ao-fix').className='btn act';document.getElementById('ao-var').className='btn'">Fixo</button><button class="btn act-am" id="ao-var" onclick="document.getElementById('ao-var').className='btn act-am';document.getElementById('ao-fix').className='btn'">Variável</button></div></div><div style="display:flex;gap:8px"><button onclick="salvarNovaOrc()" style="flex:1;padding:11px;border-radius:10px;background:#1f5138;color:white;border:none;font-weight:700;cursor:pointer">Adicionar</button><button onclick="S.showAddOrc=false;render()" style="padding:11px 16px;border-radius:10px;background:#f3f4f6;color:#6b7280;border:none;font-weight:700;cursor:pointer">Cancelar</button></div></div>`:'';
  return`
    <div class="hero" style="background:#1f5138;padding:14px"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">${[['Fixo',brl(totFix)],['Variável',brl(totVar)],['Total',brl(totFix+totVar)]].map(([lb,v])=>`<div style="text-align:center"><div style="font-size:9px;opacity:.6;text-transform:uppercase;font-weight:700">${lb}</div><div class="mon" style="font-weight:800;font-size:13px;margin-top:2px">${v}</div></div>`).join('')}</div></div>
    <div style="font-size:11px;color:#9ca3af;font-style:italic">Toque em ✏️ para editar o teto de qualquer categoria.</div>
    ${editForm}
    <div class="card" style="overflow:hidden"><div style="padding:10px 14px;background:#e7f4ee;display:flex;justify-content:space-between"><span style="font-weight:700;font-size:13px;color:#1f5138">Despesas fixas</span><span class="mon" style="font-size:12px;font-weight:700;color:#1f5138">${brl(totFix)}</span></div>${orc.fixo.map(x=>orcRow(x,'fixo')).join('')}</div>
    <div class="card" style="overflow:hidden"><div style="padding:10px 14px;background:#fff8e6;display:flex;justify-content:space-between"><span style="font-weight:700;font-size:13px;color:#b8842a">Despesas variáveis</span><span class="mon" style="font-size:12px;font-weight:700;color:#b8842a">${brl(totVar)}</span></div>${orc.variavel.map(x=>orcRow(x,'variavel')).join('')}</div>
    ${addForm}
    ${!S.showAddOrc?`<button onclick="S.showAddOrc=true;S.orcEdit=null;render()" style="padding:12px;border-radius:12px;background:white;border:2px dashed #d1d5db;color:#6b7280;font-weight:700;font-size:14px;cursor:pointer;width:100%">+ Nova categoria</button>`:''}
    <div style="height:8px"></div>`;
}

// ── Ajustes ───────────────────────────────────────────────────────────────────
function rAjustes(){
  const c=S.cfg;
  return`
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
      <div style="font-weight:800;color:#1f5138">Parâmetros financeiros</div>
      <label style="display:flex;align-items:center;justify-content:space-between;gap:12px"><span style="font-size:13px;color:#374151">Reserva inicial (R$)</span><input type="number" inputmode="decimal" class="inp" id="cfg-reservaInicial" style="width:140px;text-align:right;padding:8px 10px" value="${c.reservaInicial||0}"></label>
      <label style="display:flex;align-items:center;justify-content:space-between;gap:12px"><span style="font-size:13px;color:#374151">Salário esperado (projeção)</span><input type="number" inputmode="decimal" class="inp" id="cfg-salarioEsperado" style="width:140px;text-align:right;padding:8px 10px" value="${c.salarioEsperado||0}"></label>
      <p style="font-size:11px;color:#9ca3af;margin:0">O salário esperado é usado apenas para calcular a <b>folga projetada</b>. A folga real só conta o que você lançou como Entrada.</p>
      <button onclick="salvarCfg()" style="padding:12px;border-radius:12px;background:#1f5138;color:white;border:none;font-weight:700;font-size:14px;cursor:pointer;width:100%">Salvar</button>
    </div>
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <div style="font-weight:800;color:#1f5138">Alertas</div>
      <label style="display:flex;align-items:center;justify-content:space-between;gap:12px"><span style="font-size:13px;color:#374151">Alertar fatura com quantos dias?</span><input type="number" inputmode="numeric" class="inp" id="cfg-diasAlertaFatura" style="width:80px;text-align:right;padding:8px 10px" value="${c.diasAlertaFatura||3}" min="1" max="15"></label>
      <button onclick="salvarCfgAlertas()" style="padding:12px;border-radius:12px;background:#1f5138;color:white;border:none;font-weight:700;font-size:14px;cursor:pointer;width:100%">Salvar alertas</button>
    </div>
    <div class="card" style="padding:14px;background:#fef2f2;border-color:#fca5a5">
      <div style="font-weight:700;color:#991b1b;font-size:13px;margin-bottom:6px">⚠ Zona de perigo</div>
      <p style="font-size:12px;color:#6b7280;margin:0 0 10px">Apaga todos os lançamentos. Contas e patrimônio não são afetados.</p>
      <button onclick="zerarLancamentos()" style="padding:10px;border-radius:10px;background:#b23a48;color:white;border:none;font-weight:700;font-size:13px;cursor:pointer;width:100%">🗑️ Zerar lançamentos</button>
    </div>
    <div class="card" style="padding:14px"><div style="font-weight:700;color:#16a34a;font-size:13px">✓ Supabase conectado</div><p style="font-size:11px;color:#9ca3af;margin:4px 0 0">Dados em tempo real — compartilhado com Débora.</p></div>
    <div style="height:8px"></div>`;
}

// ── Lançar ────────────────────────────────────────────────────────────────────
const TEXT_F=new Set(['item','local','valor','data','descricao']);
function getBlankF(){return{data:today(),item:'',local:'',forma:'Cartão',cartao:'BB',avista:false,parcelas:'1',valor:'',categoria:'Outros',tipo:'Pessoal',quem:'Lucas',recorrente:false,recebido:false,cat_manual:false,descricao:''};}
function ensureL(){if(!S.editL)S.editL=getBlankF();}
function setTipo(v){
  ensureL();
  S.editL.tipo=v;
  // ajustar forma padrão conforme tipo
  if(v==='Entrada'&&S.editL.forma==='Cartão')S.editL.forma='Pix';
  if(v==='Investimento'&&S.editL.forma==='Cartão')S.editL.forma='Pix';
  if(!S.editL.cat_manual){
    if(v==='Entrada')S.editL.categoria='Salário';
    else if(v==='Investimento')S.editL.categoria='Tesouro Direto';
    else S.editL.categoria='Outros';
  }
  render();
}
function setF(k,v){ensureL();if(k==='tipo'){S.editL.tipo=v;if(!S.editL.cat_manual)S.editL.categoria=v==='Entrada'?'Salário':'Outros';render();}else if(TEXT_F.has(k)){S.editL[k]=v;}else{S.editL[k]=v;render();}}
function onItem(v){ensureL();S.editL.item=v;if(!S.editL.cat_manual){S.editL.categoria=sugg(v);const s=document.querySelector('select[onchange*="categoria"]');if(s)s.value=S.editL.categoria;}}

function rLancar(){
  const isEdit=!!(S.editL&&S.editL.id);
  const f=S.editL||getBlankF();
  const isEntrada=f.tipo==='Entrada';
  const isInv=f.tipo==='Investimento';
  const cats=isEntrada?CATS_ENT:CATS_DESP;
  const n=f.avista?1:Math.max(1,parseInt(f.parcelas)||1);
  const fi=(!isEntrada&&!isInv&&f.data)?fatInicio(f.data,f.cartao||'',f.forma):null;
  const ff=fi?(f.recorrente?norm(fi.y,fi.m+11):norm(fi.y,fi.m+n-1)):null;
  const mostraCartao=!isEntrada&&!isInv&&f.forma==='Cartão';
  const mostraParcelamento=!isEntrada&&!isInv;
  const mostraForma=!isEntrada&&!isInv;
  // para entrada: forma simplificada
  const FORMAS_ENT=['Pix','Transferência','Boleto','Dinheiro'];

  return`<div style="display:flex;flex-direction:column;gap:13px">
    ${isEdit?`<div class="row"><span style="font-weight:700;color:#1f5138">Editando lançamento</span><button onclick="S.editL=null;S.tab='painel';render()" style="font-size:12px;color:#9ca3af;background:none;border:none;cursor:pointer;text-decoration:underline">cancelar</button></div>`:''}

    <div><label class="lbl">Tipo de lançamento</label><div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn${f.tipo==='Pessoal'?' act':''}" onclick="setTipo('Pessoal')">💸 Despesa</button>
      <button class="btn${f.tipo==='Entrada'?' act-vd':''}" onclick="setTipo('Entrada')">💰 Entrada</button>
      <button class="btn${f.tipo==='Investimento'?' act-az':''}" onclick="setTipo('Investimento')">📈 Investimento</button>
      <button class="btn${f.tipo==='Fazenda'?' act-am':''}" onclick="setTipo('Fazenda')">🌿 Fazenda</button>
      <button class="btn${f.tipo==='Terceiros'?' act':''}" style="${f.tipo==='Terceiros'?'background:#7b8794;color:white;border-color:#7b8794':''}" onclick="setTipo('Terceiros')">👥 Terceiros</button>
    </div></div>

    <div><label class="lbl">${isEntrada?'Origem / descrição':'Item / descrição'}</label>
      <input class="inp" id="f-item" value="${esc(f.item)}" oninput="onItem(this.value)"
        placeholder="${isEntrada?'ex.: Salário junho, Reembolso consulta…':'ex.: Mercado, Diesel, Fatura BB…'}">
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><label class="lbl">Data</label><input type="date" class="inp" id="f-data" value="${f.data}" onchange="setF('data',this.value)"></div>
      <div><label class="lbl">Local / Origem</label><input class="inp" id="f-local" value="${esc(f.local||'')}" oninput="setF('local',this.value)" placeholder="opcional"></div>
    </div>

    <div><label class="lbl">Valor (R$)</label>
      <input type="number" inputmode="decimal" class="inp" id="f-valor" value="${f.valor}"
        oninput="setF('valor',this.value)" placeholder="0,00">
    </div>

    ${isEntrada?`
      <div><label class="lbl">Forma de recebimento</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${FORMAS_ENT.map(o=>`<button class="btn${f.forma===o?' act-vd':''}" onclick="setF('forma','${o}')">${o}</button>`).join('')}
        </div>
      </div>
      <div><label class="lbl">Categoria</label>
        <select class="sel" onchange="setF('categoria',this.value);setF('cat_manual',true)">
          ${CATS_ENT.map(c=>`<option value="${c}"${f.categoria===c?' selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="card" style="padding:12px 14px;background:#f0fdf4;border-color:#bbf7d0">
        <div style="font-size:12px;color:#166534;font-weight:700;margin-bottom:6px">💡 Renda recebida</div>
        <div style="font-size:12px;color:#166534">Esta entrada será somada à folga real do mês. Lance o salário, 13º, férias ou qualquer receita aqui.</div>
      </div>
    `:''}

    ${isInv?`
      <div><label class="lbl">Onde foi aplicado</label>
        <select class="sel" onchange="setF('categoria',this.value);setF('cat_manual',true)">
          ${['Tesouro Direto','CDB','LCI/LCA','Ações','FIIs','Consórcios','Poupança','Outros'].map(c=>`<option value="${c}"${f.categoria===c?' selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div><label class="lbl">Tipo de aporte</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn${f.avista&&!f.recorrente?' act-az':''}" onclick="setF('avista',true);setF('recorrente',false)">Pontual</button>
          <button class="btn${f.recorrente?' act-am':''}" onclick="setF('recorrente',true);setF('avista',false)">↻ Mensal</button>
        </div>
      </div>
      <div class="card" style="padding:12px 14px;background:#eff6ff;border-color:#bfdbfe">
        <div style="font-size:12px;color:#1e40af;font-weight:700;margin-bottom:4px">📈 Aporte de investimento</div>
        <div style="font-size:12px;color:#1e40af">Sai do caixa e vai para patrimônio. Aparece separado das despesas no Painel.</div>
      </div>
    `:''}

    ${mostraForma?`
      <div><label class="lbl">Forma de pagamento</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${FORMAS.map(o=>`<button class="btn${f.forma===o?' act':''}" onclick="setF('forma','${o}')">${o}</button>`).join('')}
        </div>
      </div>
    `:''}

    ${mostraCartao?`
      <div><label class="lbl">Cartão</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${CARTOES.map(o=>`<button class="btn${f.cartao===o?' act':''}" onclick="setF('cartao','${o}')">${o}</button>`).join('')}
        </div>
      </div>
    `:''}

    ${mostraParcelamento?`
      <div><label class="lbl">Tipo de pagamento</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn${f.avista&&!f.recorrente?' act':''}" onclick="setF('avista',true);setF('recorrente',false)">À vista</button>
          <button class="btn${!f.avista&&!f.recorrente?' act':''}" onclick="setF('avista',false);setF('recorrente',false)">Parcelado</button>
          <button class="btn${f.recorrente?' act-am':''}" onclick="setF('recorrente',!${f.recorrente});setF('avista',false)">↻ Recorrente</button>
        </div>
      </div>
      ${!f.avista&&!f.recorrente?`<div><label class="lbl">Nº de parcelas</label>
        <select class="sel" onchange="setF('parcelas',this.value)">
          ${Array.from({length:12},(_,i)=>i+1).map(k=>`<option value="${k}"${f.parcelas==k?' selected':''}>${k}x</option>`).join('')}
        </select></div>`:''}
      <div><label class="lbl">Categoria</label>
        <select class="sel" onchange="setF('categoria',this.value);setF('cat_manual',true)">
          ${CATS_DESP.map(c=>`<option value="${c}"${f.categoria===c?' selected':''}>${c}</option>`).join('')}
        </select>
      </div>
    `:''}

    <div><label class="lbl">Quem lançou</label>
      <div style="display:flex;gap:8px">
        ${QUEM.map(o=>`<button class="btn${f.quem===o?' act':''}" onclick="setF('quem','${o}')">${o}</button>`).join('')}
      </div>
    </div>

    ${f.valor&&f.item&&!isEntrada&&!isInv&&fi?`
      <div style="background:rgba(31,81,56,.07);border:1px solid rgba(31,81,56,.15);border-radius:12px;padding:12px;font-size:13px">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(31,81,56,.7);font-weight:700;margin-bottom:6px">Prévia automática</div>
        <div class="row"><span style="color:#6b7280">Parcela</span><span class="mon" style="font-weight:700">${brl((+f.valor||0)/(f.avista?1:n))} ${f.recorrente?'(recorrente)':n>1?`× ${n}`:''}</span></div>
        <div class="row" style="margin-top:4px"><span style="color:#6b7280">Faturas</span><span style="font-weight:700">${mlbl(fi.y,fi.m)}${n>1||f.recorrente?` → ${mlbl(ff.y,ff.m)}`:''}</span></div>
      </div>
    `:''}

    ${['Pix','Boleto','Débito','Transferência'].includes(f.forma)&&!isEntrada&&!isInv&&S.contas.length>0?
      `<div class="alerta info">💡 Ao salvar, será perguntado de qual conta debitar automaticamente.</div>`:''}

    <button onclick="salvarLanc()" style="padding:14px;border-radius:12px;font-weight:700;font-size:15px;background:${isEntrada?'#16a34a':isInv?'#2c6fad':'#1f5138'};color:white;border:none;cursor:pointer;width:100%">
      ${isEdit?'✏️ Salvar alteração':isEntrada?'💰 Registrar entrada':isInv?'📈 Registrar aporte':'➕ Salvar lançamento'}
    </button>
    <div style="height:8px"></div>
  </div>`;
}

// ── Handlers ──────────────────────────────────────────────────────────────────
function salvarCfg(){
  ['reservaInicial','salarioEsperado'].forEach(k=>{const el=document.getElementById('cfg-'+k);if(el)S.cfg[k]=parseFloat(el.value)||0;});
  localStorage.setItem('fin_cfg',JSON.stringify(S.cfg));flash('Salvo! ✓');render();
}
function salvarCfgAlertas(){
  const el=document.getElementById('cfg-diasAlertaFatura');if(el)S.cfg.diasAlertaFatura=parseInt(el.value)||3;
  localStorage.setItem('fin_cfg',JSON.stringify(S.cfg));flash('Alertas salvos! ✓');render();
}
async function salvarEditConta(id){
  const c=S.contas.find(x=>x.id===id);if(!c)return;
  await updConta({...c,saldo_pessoal:parseFloat(document.getElementById('ec-p')?.value)||0,saldo_fazenda:parseFloat(document.getElementById('ec-f')?.value)||0,alerta_minimo:parseFloat(document.getElementById('ec-min')?.value)||0});
}
async function salvarNovaConta(){
  const nome=document.getElementById('nc-nome')?.value;if(!nome)return;
  await addConta({id:uid(),nome,saldo_pessoal:parseFloat(document.getElementById('nc-p')?.value)||0,saldo_fazenda:parseFloat(document.getElementById('nc-f')?.value)||0,alerta_minimo:parseFloat(document.getElementById('nc-min')?.value)||0,created_at:new Date().toISOString()});
}
async function salvarMovManual(){
  const id=S.showAddMov;if(!id)return;
  const val=parseFloat(document.getElementById('mv-val')?.value)||0;if(!val){alert('Preencha o valor.');return;}
  const mv={id:uid(),conta_id:id,descricao:document.getElementById('mv-desc')?.value||'',categoria:document.getElementById('mv-cat')?.value||'Outros',natureza:document.getElementById('mv-ent')?.className?.includes('act-vd')?'Entrada':'Saída',tipo_conta:document.getElementById('mv-faz')?.className?.includes('act-am')?'Fazenda':'Pessoal',valor:val,data:document.getElementById('mv-data')?.value||today(),destino:document.getElementById('mv-dest')?.value||'',created_at:new Date().toISOString()};
  await addMovComSaldo(mv);
}
function salvarOrcEdit(){
  const el=document.getElementById('oe-val');if(!el||!S.orcEdit)return;
  const val=parseFloat(el.value)||0;const tipo=S.orcEdit.tipo;const cat=S.orcEdit.cat;
  const idx=S.orc[tipo].findIndex(x=>x.cat===cat);
  if(idx>=0)S.orc[tipo][idx].valor=val;
  saveOrc();S.orcEdit=null;flash('Teto salvo! ✓');render();
}
function salvarNovaOrc(){
  const cat=document.getElementById('ao-cat')?.value?.trim();const val=parseFloat(document.getElementById('ao-val')?.value)||0;
  const isFix=document.getElementById('ao-fix')?.className?.includes('act');
  if(!cat){alert('Informe o nome.');return;}
  const tipo=isFix?'fixo':'variavel';
  if(S.orc[tipo].find(x=>x.cat===cat)){alert('Já existe.');return;}
  S.orc[tipo].push({cat,valor:val});saveOrc();S.showAddOrc=false;flash('Categoria adicionada! ✓');render();
}
async function salvarEditInv(id){
  const p=S.patr.find(x=>x.id===id);if(!p)return;
  const upd={...p,nome:document.getElementById('ei-nome')?.value||p.nome,valor_investido:parseFloat(document.getElementById('ei-inv')?.value)||0,valor_atual:parseFloat(document.getElementById('ei-at')?.value)||0,aporte_mensal:parseFloat(document.getElementById('ei-ap')?.value)||0,updated_at:new Date().toISOString()};
  if(!await sbDo(()=>SB.from('patrimonio').update(upd).eq('id',id),'Erro'))return;
  S.patr=S.patr.map(x=>x.id===id?upd:x);S.editInv=null;flash('Atualizado! ✓');render();
}
async function salvarNovoInv(){
  const nome=document.getElementById('ni-nome')?.value;const atual=parseFloat(document.getElementById('ni-at')?.value)||0;
  if(!nome||!atual){alert('Preencha nome e valor atual.');return;}
  const p={id:uid(),nome,categoria:document.getElementById('ni-cat')?.value||'Outros',valor_investido:parseFloat(document.getElementById('ni-inv')?.value)||0,valor_atual:atual,data_compra:today(),aporte_mensal:parseFloat(document.getElementById('ni-ap')?.value)||0,dia_aporte:parseInt(document.getElementById('ni-dia')?.value)||null,updated_at:new Date().toISOString()};
  if(!await sbDo(()=>SB.from('patrimonio').insert([p]),'Erro'))return;
  S.patr=[...S.patr,p];S.showAddInv=false;flash('Ativo adicionado! ✓');render();
}
async function zerarLancamentos(){
  if(!confirm('Apagar TODOS os lançamentos?'))return;
  await SB.from('lancamentos').delete().neq('id','__never__');
  S.lanc=[];S.sel=null;flash('Zerado! ✓');S.tab='painel';render();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
sbInit();
</script>
</body>
</html>
